# Contract enforced by scripts/validate_return.py. Keep the two in sync: a workpaper built
# from this file must be able to pass validation once every item is reviewed.
schema_version: 0.3.0
required:
  - tax_year
  - taxpayer
  - jurisdictions
  - final_fields
status_values:
  - VERIFIED
  - UNVERIFIED
  - REVIEW_REQUIRED
  - MISSING_DOCUMENT
  - NOT_APPLICABLE
taxpayers:                       # optional; once present every VERIFIED final field must name a person
  - id: P1
    role: taxpayer
  - id: P2
    role: spouse
jurisdictions:
  federal: CH
  cantonal: CH-TI
  municipality:
    code: null
    name: null
traceability:
  # One entry of workpaper.final_fields. A VERIFIED entry needs every key below.
  # NOT_APPLICABLE needs notes and no value. Any other status is reported as unresolved.
  final_field:
    section: null
    field: null
    person: null                  # taxpayer id (P1, P2, ...) or HOUSEHOLD; required when workpaper.taxpayers is set
    value: null
    tax_year: null
    jurisdiction: null            # CH or CH-TI, must equal the rule's jurisdiction
    status: REVIEW_REQUIRED
    rule:
      rule_id: null               # must exist in rules/<tax_year>/*.yaml with VERIFIED provenance
    source_document: []           # list of source_document_value entries
    calculation:
      calculation_id: null
      status: REVIEW_REQUIRED
      tax_year: null
      rule_ids: []                # exactly [rule.rule_id]
      operation: null             # identity | sum | difference | rule_value_times | percent_clamped
      cap: []                     # [{key: <base limit>}, {key: <per-unit limit>, times_input: {document, field}}]
                                  # -> min(result, one base limit + per-unit limits x a documented whole number).
                                  # Allowed keys come from the rule's `application`; a literal `times` is rejected.
                                  # REQUIRED with identity/sum/difference when the rule defines a limit
      # The three operations below take their keys from the rule's `application`; a workpaper may repeat
      # them but cannot change them.
      value_key: null             # rule_value_times: single whole-number input x rule.values[value_key]
      percent_key: null           # percent_clamped: sum(inputs) x rule.values[percent_key] / 100,
      min_key: null               #   raised to rule.values[min_key] and
      max_key: null               #   lowered to rule.values[max_key] when given
      inputs: []                  # [{document, field}] each resolving to a source_document entry
      result: null                # must equal value
    notes: []
source_document_value:
  document: null
  page: null                      # positive integer
  field: null
  original_text: null             # literal quote; must contain extracted_value as printed (98'000.00, 98000.-, ...)
  extracted_value: null
  confidence: null                # >= config.yaml extraction.review_confidence_threshold
  tax_year: null
  status: REVIEW_REQUIRED
